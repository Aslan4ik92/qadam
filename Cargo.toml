[workspace]
resolver = "2"
members = [
    "crates/qidir-core",
    "crates/qidir-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/aslan4ik92/qadam"
authors = ["QIDIR contributors"]

[workspace.dependencies]
qidir-core = { path = "crates/qidir-core" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1.10"
tantivy = "0.24"
rust-stemmers = "1.2"
unicode-normalization = "0.1"
walkdir = "2.5"
globset = "0.4"
notify = "8.0"
notify-debouncer-full = "0.5"
redb = "2.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
calamine = "0.26"
pdf-extract = "0.8"
cfb = "0.10"
chardetng = "0.1"
encoding_rs = "0.8"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
num_cpus = "1.16"
clap = { version = "4.5", features = ["derive", "env"] }
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
