name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build & publish Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-windows
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing: set these repository secrets to sign the
          # installers with your certificate.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "QIDIR ${{ github.ref_name }}"
          releaseBody: |
            Установщики QIDIR для Windows 10/11 (x64):
            * `QIDIR_*_x64-setup.exe` — NSIS, установка для текущего пользователя, не требует прав администратора
            * `QIDIR_*_x64_ru-RU.msi` — MSI для корпоративного развёртывания

            QIDIR installers for Windows 10/11 (x64).
          releaseDraft: true
          prerelease: false
          args: --ci
      - name: Portable build
        shell: pwsh
        run: |
          cargo build --release -p qidir-cli
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path portable/QIDIR-portable | Out-Null
          Copy-Item target/release/qidir-desktop.exe portable/QIDIR-portable/QIDIR.exe
          Copy-Item target/release/qidir.exe portable/QIDIR-portable/qidir.exe
          Copy-Item LICENSE portable/QIDIR-portable/LICENSE.txt
          Copy-Item docs/SEARCH_SYNTAX.md portable/QIDIR-portable/SYNTAX.md
          Copy-Item release/QIDIR-portable/README.txt portable/QIDIR-portable/README.txt
          Compress-Archive -Path portable/QIDIR-portable -DestinationPath "QIDIR-$v-windows-x64-portable.zip" -Force
          gh release upload "${{ github.ref_name }}" "QIDIR-$v-windows-x64-portable.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
